<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - SaaS Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
        <h4 class="fw-bold mb-3 text-center">Nueva Contraseña</h4>
        <p class="text-muted small text-center">Ingresá tu nueva contraseña para actualizar tu cuenta.</p>

        <form id="form-reset">
            <div class="mb-3">
                <label class="form-label">Nueva Contraseña</label>
                <input type="password" id="nueva-password" class="form-control" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>
            <button type="submit" id="btn-guardar" class="btn btn-primary w-100">Guardar Contraseña</button>
        </form>
    </div>

    <script>
    const API_URL = "http://127.0.0.1:8000";

    document.getElementById("form-reset").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");
        const nuevaPassword = document.getElementById("nueva-password").value;
        const btn = document.getElementById("btn-guardar");

        if (!token) {
            alert("El token de recuperación no es válido o falta en la URL.");
            return;
        }

        btn.disabled = true;
        btn.textContent = "Guardando...";

        const formData = new FormData();
        formData.append("token", token);
        formData.append("nueva_password", nuevaPassword);

        try {
            const res = await fetch(`${API_URL}/auth/reset-password`, {
                method: "POST",
                body: formData
            });

            const data = await res.json();

            if (res.ok) {
                alert(data.mensaje);
                window.location.href = "login.html"; // Redirige al login.html
            } else {
                alert(data.detail || "Error al cambiar la contraseña.");
            }
        } catch (err) {
            console.error("Error:", err);
            alert("Ocurrió un error al intentar cambiar la contraseña.");
        } finally {
            btn.disabled = false;
            btn.textContent = "Guardar Contraseña";
        }
    });
    </script>
</body>
</html>
