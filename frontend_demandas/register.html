<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - SaaS Demandas Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h3 class="text-center mb-4 fw-bold">Crear Cuenta</h3>
                
                <form id="registerForm" onsubmit="registrarUsuario(event)">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Estudio Jurídico</label>
                        <input type="text" id="nombre_estudio" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Registrarse</button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted">¿Ya tenés cuenta? <a href="login.html">Iniciar Sesión</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000";

    async function registrarUsuario(event) {
        event.preventDefault();

        const data = {
            nombre_estudio: document.getElementById("nombre_estudio").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        try {
            const response = await fetch(`${API_URL}/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

           if (response.ok) {
            const data = await response.json();
    
                // Si el registro ya devuelve el token, lo guardamos de una
                if (data.access_token) {
                    localStorage.setItem("access_token", data.access_token);
                     // Lo mandamos directo a la pasarela de pago o pantalla de suscripción
                    window.location.href = "suscripcion.html"; 
                } else {
                    // Si solo crea el usuario, lo mandamos al login con aviso
                    alert("¡Registro exitoso! Por favor inicie sesión para continuar con la suscripción.");
                    window.location.href = "login.html";
                    }
            } else {
                const errData = await response.json();
                alert("Error al registrarse: " + (errData.detail || "Verifica los datos"));
            }
        } catch (error) {
            console.error("Error de red:", error);
            alert("No se pudo conectar con el servidor.");
        }
    }
</script>
</body>
</html>
