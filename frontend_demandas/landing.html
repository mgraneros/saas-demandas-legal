<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Demandas Legal - Gestión Inteligente</title>

    <!-- Fuente Premium -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tu hoja de estilos compartida -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Navbar Adaptativo -->
<nav class="navbar navbar-expand-lg border-bottom py-3" style="background-color: var(--bg-sidebar); border-color: var(--border-color) !important;">
    <div class="container d-flex justify-content-between align-items-center">
        <!-- Logo de Marca -->
        <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="#">
            <div class="brand-icon">⚖️</div>
            <div class="brand-text">SaaS <span>Legal</span></div>
        </a>

        <!-- Acciones Derecha -->
        <div class="d-flex align-items-center gap-2 gap-sm-3">
            <!-- Toggle Modo Claro / Oscuro -->
            <button id="themeToggleBtn" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2" style="border-color: var(--border-color); color: var(--text-main);">
                <span id="themeIcon">☀️</span>
                <span id="themeText" class="small fw-semibold d-none d-sm-inline">Modo Claro</span>
            </button>

            <a href="login.html" class="btn btn-sm btn-outline-secondary fw-semibold px-3" style="border-color: var(--border-color); color: var(--text-main);">Iniciar Sesión</a>
            <a href="register.html" class="btn btn-sm btn-primary fw-semibold px-3">Registrarse</a>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<div class="container py-5 text-center my-5">
    <h1 class="display-3 fw-bold mb-3">Automatizá tus demandas</h1>
    <p class="lead text-muted mx-auto" style="max-width: 650px;">
        Generá escritos, calculá daños y gestioná tu historial legal en minutos de forma automática.
    </p>
    <div class="mt-4">
        <a href="register.html" class="btn btn-primary btn-lg px-4 fw-semibold shadow-sm">Comenzar ahora</a>
    </div>
</div>

<!-- Script de Gestión de Tema / Persistencia -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const toggleBtn = document.getElementById("themeToggleBtn");
        const themeIcon = document.getElementById("themeIcon");
        const themeText = document.getElementById("themeText");
        
        // 1. Cargar tema guardado o usar 'dark'
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
        if (toggleBtn) updateButtonUI(savedTheme);

        // 2. Evento Toggle
        if (toggleBtn) {
            toggleBtn.addEventListener("click", () => {
                const currentTheme = document.documentElement.getAttribute("data-theme");
                const newTheme = currentTheme === "dark" ? "light" : "dark";
                
                document.documentElement.setAttribute("data-theme", newTheme);
                localStorage.setItem("theme", newTheme);
                updateButtonUI(newTheme);
            });
        }

        function updateButtonUI(theme) {
            if (themeIcon) themeIcon.textContent = theme === "dark" ? "☀️" : "🌙";
            if (themeText) themeText.textContent = theme === "dark" ? "Modo Claro" : "Modo Oscuro";
        }
    });
</script>

</body>
</html>
