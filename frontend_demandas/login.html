<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - SaaS Demandas Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h3 class="text-center mb-4 fw-bold">Iniciar Sesión</h3>
                
                <form id="loginForm" onsubmit="iniciarSesion(event)">
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico (Usuario)</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>

                    <!-- Enlace de Olvidaste tu contraseña -->
                    <div class="mb-3 text-end">
                        <a href="#" data-bs-toggle="modal" data-bs-target="#modalOlvidePassword" class="small text-muted text-decoration-none">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2">Ingresar</button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted">¿No tenés cuenta? <a href="register.html">Registrarse</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL PARA RECUPERAR CONTRASEÑA -->
<div class="modal fade" id="modalOlvidePassword" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow rounded-4">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold">Recuperar Contraseña</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Ingresá tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
        <form id="form-olvide-password">
          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email-recuperacion" class="form-control" placeholder="tu@email.com" required>
          </div>
          <button type="submit" id="btn-enviar-recuperacion" class="btn btn-primary w-100">Enviar enlace</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- JS de Bootstrap imprescindible para que funcionen los Modales -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = "http://127.0.0.1:8000";

    // 1. INICIAR SESIÓN
    async function iniciarSesion(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const formData = new URLSearchParams();
        formData.append("username", email);
        formData.append("password", password);

        try {
            const response = await fetch(`${API_URL}/token`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem("access_token", data.access_token);
                window.location.href = "index.html"; 
            } else {
                alert("Email o contraseña incorrectos.");
            }
        } catch (error) {
            console.error("Error de red:", error);
            alert("No se pudo conectar con el servidor.");
        }
    }

    // 2. SOLICITAR ENLACE DE RECUPERACIÓN DE CONTRASEÑA
    document.getElementById("form-olvide-password").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email-recuperacion").value;
        const btn = document.getElementById("btn-enviar-recuperacion");

        btn.disabled = true;
        btn.textContent = "Enviando...";

        const formData = new FormData();
        formData.append("email", email);

        try {
            const res = await fetch(`${API_URL}/auth/olvide-password`, {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            alert(data.mensaje);

            const modalEl = document.getElementById("modalOlvidePassword");
            const modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();
            document.getElementById("email-recuperacion").value = "";

        } catch (err) {
            console.error("Error al solicitar recuperación:", err);
            alert("Ocurrió un error al procesar la solicitud.");
        } finally {
            btn.disabled = false;
            btn.textContent = "Enviar enlace";
        }
    });
</script>
</body>
</html>
