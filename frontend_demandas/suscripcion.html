<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción - Generador de Demandas</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="auth-guard.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f7f6; }
        .pricing-card { max-width: 450px; margin: 80px auto; }
        .card-header { padding: 20px; }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="pricing-card card shadow-lg border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">¡Casi listo para empezar!</h4>
            </div>
            <div class="card-body p-4">
                <h5 class="card-title mt-2 mb-3">Suscríbete al Plan Premium</h5>
                <ul class="list-unstyled text-start mb-4">
                    <li>✅ Generación ilimitada de demandas.</li>
                    <li>✅ Acceso a herramientas de auditoría.</li>
                    <li>✅ Soporte técnico prioritario.</li>
                </ul>
                <button id="btn-mercadopago" class="btn btn-success btn-lg w-100 shadow-sm">
                    Pagar con Mercado Pago
                </button>
                <p class="text-muted mt-3 small">Acceso seguro a través de Mercado Pago.</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://saas-demandas-legal.onrender.com";

        function obtenerToken() {
            return localStorage.getItem("access_token") || localStorage.getItem("token");
        }

        // Verificación de seguridad al cargar
        document.addEventListener('DOMContentLoaded', () => {
            const token = obtenerToken();
            if (!token) {
                window.location.href = "login.html";
            }
        });

        // Lógica de Pago
        document.getElementById('btn-mercadopago').addEventListener('click', async () => {
            const token = obtenerToken();
            
            if (!token) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Sesión expirada',
                    text: 'Por favor, iniciá sesión nuevamente.',
                    confirmButtonText: 'Ir al login'
                }).then(() => {
                    window.location.href = "login.html";
                });
                return;
            }

            Swal.fire({
                title: 'Preparando pago...',
                text: 'Redirigiendo a Mercado Pago...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });
            
            try {
                const response = await fetch(`${API_URL}/crear-preferencia-suscripcion/`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    }
                });
                
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(data.detail || "No se pudo conectar con el procesador de pagos.");
                }
                
                if (data.init_point) {
                    // Redirige al checkout de producción de Mercado Pago
                    window.location.href = data.init_point;
                } else {
                    throw new Error("No se recibió el enlace de pago desde Mercado Pago.");
                }
            } catch (err) {
                console.error("Error al generar checkout:", err);
                Swal.fire('Error', err.message || 'Problema de conexión con el servidor.', 'error');
            }
        });
    </script>
</body>
</html>
