<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - SaaS Demandas Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h3 class="text-center mb-4 fw-bold">Iniciar Sesión</h3>
                
                <form id="loginForm" onsubmit="iniciarSesion(event)">
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico (Usuario)</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2">Ingresar</button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted">¿No tenés cuenta? <a href="register.html">Registrarse</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000";

    async function iniciarSesion(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // FastAPI OAuth2PasswordRequestForm requiere form-data con 'username' y 'password'
        const formData = new URLSearchParams();
        formData.append("username", email);
        formData.append("password", password);

        try {
            const response = await fetch(`${API_URL}/token`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData
            });

            if (response.ok) {
                const data = await response.json();
                // Guardamos el token en el almacenamiento local del navegador
                localStorage.setItem("access_token", data.access_token);
                window.location.href = "index.html"; // Redirige al panel principal
            } else {
                alert("Email o contraseña incorrectos.");
            }
        } catch (error) {
            console.error("Error de red:", error);
            alert("No se pudo conectar con el servidor.");
        }
    }
</script>
</body>
</html>
